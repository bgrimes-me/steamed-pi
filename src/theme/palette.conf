# Steamed Pi palette (sampled from the logo + wallpaper). Change these to re-theme everything.
ACCENT="#FFC53D"        # amber: the pi symbol, "ed Pi", the underline
TEXT="#F2EDE4"          # warm white lettering
MUTED="#847D74"         # "presents" gray
TAN="#E2B276"           # steam puff
COPPER="#B07642"
SPARK="#C8691F"
BG_DESKTOP="#040404"    # wallpaper black
BG_TERMINAL="#0D0A07"   # warm near-black, a touch lifted for readability
GNOME_ACCENT="yellow"   # closest GNOME accent to the amber
GTK_THEME="Yaru-yellow-dark"
ICON_THEME="Yaru-yellow-dark"
# 16 ANSI colors (all >= 4.5:1 on BG_TERMINAL except bright black, ~4:1 for dim text)
PALETTE="'#1B1612', '#E5533D', '#8FB85A', '#FFC53D', '#6F9BD1', '#C77BA3', '#5FB5A5', '#D9D2C5', '#7A6F63', '#FF7B5E', '#B4D87A', '#FFD670', '#98BDE8', '#E39CC2', '#8DDCCB', '#F2EDE4'"

# UI colors for the console menu (overlay) and the web dashboard. Derived from the palette above.
CARD="#17110C"          # buttons / panels
LINE="#3A2416"          # borders (dark brown from the steam puff)
FOCUS_BG="#2A1A0C"      # focused button fill
OK="#8FB85A"            # good / on
BAD="#E5533D"           # danger / off-warning
WARN="#C8691F"          # warning (spark orange)
ON_ACCENT="#0D0A07"     # text drawn on top of the amber accent
BRAND_LOGO="$HOME/.local/share/steamed-pi/art/brand/logo.png"   # shown in the dashboard header
